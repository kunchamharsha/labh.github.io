  <!--
    Per-stock canonical, title and social URLs are set synchronously here, before the
    page renders. A static canonical pointing at /stocks/details.html would tell Google
    that every ?symbol= URL is a duplicate of one page, so none is shipped in the HTML.
  -->
  <script>
    (function () {
      var raw = new URLSearchParams(location.search).get('symbol') || '';
      var sym = raw.trim().toUpperCase().replace(/\.NSE$/, '');
      var head = document.head;
      if (!/^[A-Z0-9&_\-]{1,20}$/.test(sym)) {
        // No (or invalid) symbol: nothing worth indexing on this URL.
        document.getElementById('metaRobots').setAttribute('content', 'noindex, follow');
        return;
      }
      window.__STOCK_SYMBOL__ = sym;
      var url = 'https://labh.io/stocks/details.html?symbol=' + encodeURIComponent(sym);
      var link = document.createElement('link');
      link.rel = 'canonical';
      link.id = 'canonicalUrl';
      link.href = url;
      head.appendChild(link);
      document.getElementById('ogUrl').setAttribute('content', url);
      var t = sym + ' Share Price Today, Fundamentals & Financials | Labh';
      document.title = t;
      document.getElementById('ogTitle').setAttribute('content', t);
      document.getElementById('twitterTitle').setAttribute('content', t);
    })();
  </script>

  <style>

    }

    .fin-table tr:last-child td {

    .promo-btn {

      text-decoration: none;

    .promo-btn:hover {
      background-color: var(--purple-light);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);

    /* Add padding to body to prevent content from being hidden under footer */
    body {
      padding-bottom: 80px;

    @media (max-width: 768px) {
      .promo-footer {
        padding: 1rem;

    .breadcrumb ol {

  <!-- No JavaScript Warning -->
  <noscript>
    <div style="padding: 2rem; text-align: center; background: #1a1a2e; color: #fff;">
      <h1>JavaScript Required</h1>
      <p>This page requires JavaScript to display stock data. Please enable JavaScript in your browser settings.</p>

    </div>
  </noscript>

  <!-- Sticky Promotional Footer -->
  <footer class="promo-footer" role="contentinfo" aria-label="Promotional banner">
    <div class="promo-content">
      <p class="promo-text">Looking to Invest in stocks? Check Expert picked Stock Baskets by Labh</p>
      <a href="https://labh.io/download" class="promo-btn" aria-label="Download Labh app">Download Now</a>
    </div>
  </footer>

  <script>
    // Symbol is validated + normalised (uppercase, no .NSE suffix) by the inline script in <head>
    const symbol = window.__STOCK_SYMBOL__ || null;

    // API Configuration
    const API_URL = 'https://api.labh.io/open/stock-fundamentals';

    // Initialize page
    if (!symbol) {
      showError('No stock symbol provided', 'Please select a stock from the search page.');
    } else {
      loadStockData(symbol);
    }

    // Fetch stock data from API
    async function loadStockData(symbol) {
      showLoading();

      try {
        const response = await fetch(`${API_URL}?symbol=${encodeURIComponent(symbol)}.NSE`);

        if (!response.ok) {
          throw new Error('Failed to fetch stock data');
        }

        const data = await response.json();
        displayStockData(data, symbol);
      } catch (error) {
        console.error('Error loading stock data:', error);
        showError('Failed to load stock data', 'Please try again later or contact support.');
      }
    }

    // Display stock data
    function displayStockData(data, symbol) {
      // Extract data from API response structure
      const general = data.fundamentals?.General || {};
      const highlights = data.fundamentals?.Highlights || {};
      const valuation = data.fundamentals?.Valuation || {};
      const technicals = data.fundamentals?.Technicals || {};
      const dividends = data.fundamentals?.SplitsDividends || {};
      const priceHistory = data.last_5_years_price || [];

      // Get current and previous price from price history
      const currentPriceData = priceHistory[priceHistory.length - 1] || {};
      const previousPriceData = priceHistory[priceHistory.length - 2] || {};
      const currentPrice = currentPriceData.price || 0;
      const previousClose = previousPriceData.price || currentPrice;
      const priceChange = currentPrice - previousClose;
      const priceChangePercent = previousClose ? ((priceChange / previousClose) * 100) : 0;
      const isPositive = priceChange >= 0;

      const stockName = escapeHTML(general.Name || symbol);
      const asOfDate = currentPriceData.date ? new Date(currentPriceData.date) : new Date();
      const asOfLabel = asOfDate.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });

      // Header Content
      const headerHTML = `
        <div class="stock-title-section">
          <div class="stock-info">
            <nav class="breadcrumb" aria-label="Breadcrumb">
              <ol>
                <li><a href="/">Home</a></li>
                <li><a href="/search.html">Stocks</a></li>
                <li aria-current="page">${stockName}</li>
              </ol>
            </nav>
            <h1 class="stock-name">${stockName} Share Price</h1>
            <div class="stock-symbol" aria-label="Stock symbol and exchange">${escapeHTML(general.Code || symbol)} • ${escapeHTML(general.Exchange || 'NSE')}</div>
            <div class="stock-tags" role="list" aria-label="Stock categories">
              <span class="tag" role="listitem">${escapeHTML(general.Sector || 'N/A')}</span>
              <span class="tag" role="listitem">${escapeHTML(general.Industry || 'N/A')}</span>
            </div>
          </div>
          <div class="stock-price-section">
            <div class="current-price">₹${formatNumber(currentPrice)}</div>

    // Update SEO meta tags and structured data
    function updateSEOTags(data, symbol, currentPrice, priceChange, priceChangePercent) {
      const general = data.fundamentals?.General || {};
      const highlights = data.fundamentals?.Highlights || {};

      const stockName = general.Name || symbol;
      const sector = general.Sector || '';
      const exchange = general.Exchange || 'NSE';
      const priceHistory = data.last_5_years_price || [];
      const lastDate = priceHistory[priceHistory.length - 1]?.date;
      const asOfLabel = (lastDate ? new Date(lastDate) : new Date())
        .toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });

      // Title: "<Company> Share Price Today (<SYMBOL>)" matches how Indian users search
      const title = `${stockName} Share Price Today (${symbol}) - Fundamentals & Financials | Labh`;
      document.getElementById('pageTitle').textContent = title;
      document.title = title;

      // Meta description (~155 chars, leads with the price query)
      const stats = [];
      if (highlights.MarketCapitalization) stats.push(`Market cap ₹${formatLargeNumber(highlights.MarketCapitalization)}`);
      if (highlights.PERatio) stats.push(`P/E ${formatNumber(highlights.PERatio)}`);
      const description = `${stockName} (${exchange}: ${symbol}) share price today is ₹${formatNumber(currentPrice)} (${priceChange >= 0 ? '+' : ''}${priceChangePercent.toFixed(2)}%) as of ${asOfLabel}.`
        + (stats.length ? ` ${stats.join(', ')}.` : '')
        + ` View quarterly results, balance sheet, cash flow & charts on Labh.`;
      document.getElementById('pageDescription').setAttribute('content', description);

      const canonicalUrl = `https://labh.io/stocks/details.html?symbol=${encodeURIComponent(symbol)}`;
      let canonical = document.getElementById('canonicalUrl');
      if (!canonical) {
        canonical = document.createElement('link');
        canonical.rel = 'canonical';
        canonical.id = 'canonicalUrl';
        document.head.appendChild(canonical);
      }
      canonical.setAttribute('href', canonicalUrl);

      // Open Graph / Twitter
      document.getElementById('ogUrl').setAttribute('content', canonicalUrl);
      document.getElementById('ogTitle').setAttribute('content', title);
      document.getElementById('ogDescription').setAttribute('content', description);
      document.getElementById('twitterTitle').setAttribute('content', title);
      document.getElementById('twitterDescription').setAttribute('content', description);

      // Structured data: WebPage about a Corporation (with tickerSymbol), BreadcrumbList, FAQPage.
      // Note: no AggregateRating/Offer — fabricated ratings violate Google's guidelines.
      const corporation = {
        "@type": "Corporation",
        "@id": `${canonicalUrl}#corporation`,
        "name": stockName,
        "tickerSymbol": `${exchange}: ${symbol}`,
        "description": general.Description || `${stockName} is listed on the ${exchange}.`
      };
      if (general.ISIN) corporation.identifier = { "@type": "PropertyValue", "propertyID": "ISIN", "value": general.ISIN };
      if (/^https?:\/\//i.test(general.WebURL || '')) corporation.url = general.WebURL;
      if (general.FullTimeEmployees) corporation.numberOfEmployees = { "@type": "QuantitativeValue", "value": general.FullTimeEmployees };
      if (general.AddressData || general.CountryName) {
        corporation.address = {
          "@type": "PostalAddress",
          "streetAddress": general.AddressData?.Street || undefined,
          "addressLocality": general.AddressData?.City || undefined,
          "addressRegion": general.AddressData?.State || undefined,
          "addressCountry": general.AddressData?.Country || general.CountryName || "India"
        };
      }
      if (sector) corporation.industry = general.Industry ? `${sector} - ${general.Industry}` : sector;

      const faqs = buildFaqs(data, symbol, currentPrice, asOfLabel);

      const graph = {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebPage",
            "@id": canonicalUrl,
            "url": canonicalUrl,
            "name": title,
            "description": description,
            "inLanguage": "en-IN",
            "dateModified": lastDate || new Date().toISOString().slice(0, 10),
            "isPartOf": { "@type": "WebSite", "name": "Labh", "url": "https://labh.io" },
            "publisher": { "@type": "Organization", "name": "Labh", "url": "https://labh.io", "logo": "https://labh.io/assets/LOGO.png" },
            "about": { "@id": `${canonicalUrl}#corporation` },
            "breadcrumb": { "@id": `${canonicalUrl}#breadcrumb` }
          },
          corporation,
          {
            "@type": "BreadcrumbList",
            "@id": `${canonicalUrl}#breadcrumb`,
            "itemListElement": [
              { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://labh.io/" },
              { "@type": "ListItem", "position": 2, "name": "Stocks", "item": "https://labh.io/search.html" },
              { "@type": "ListItem", "position": 3, "name": `${stockName} Share Price`, "item": canonicalUrl }
            ]
          },
          {
            "@type": "FAQPage",
            "@id": `${canonicalUrl}#faq`,
            "mainEntity": faqs.map(f => ({
              "@type": "Question",
              "name": f.q,
              "acceptedAnswer": { "@type": "Answer", "text": f.a }
            }))
          }
        ]
      };

      const structuredDataScript = document.getElementById('structuredData');
      if (structuredDataScript) {
        structuredDataScript.textContent = JSON.stringify(graph);
      }
    }

    // Plain-text overview paragraph built from the data (indexable text, not just numbers in cards)
    function buildSummary(data, symbol, currentPrice, priceChangePercent, asOfLabel) {
      const g = data.fundamentals?.General || {};
      const h = data.fundamentals?.Highlights || {};
      const t = data.fundamentals?.Technicals || {};
      const name = g.Name || symbol;
      const s = [];
      s.push(`${name} (${g.Exchange || 'NSE'}: ${symbol}) shares closed at ₹${formatNumber(currentPrice)} on ${asOfLabel}, ${priceChangePercent >= 0 ? 'up' : 'down'} ${Math.abs(priceChangePercent).toFixed(2)}% from the previous close.`);
      if (g.Sector) s.push(`The company operates in the ${g.Sector}${g.Industry ? ` sector (${g.Industry})` : ' sector'}.`);
      if (h.MarketCapitalization) s.push(`It has a market capitalisation of ₹${formatLargeNumber(h.MarketCapitalization)}${h.PERatio ? ` and trades at a P/E ratio of ${formatNumber(h.PERatio)}` : ''}.`);
      if (t['52WeekHigh'] && t['52WeekLow']) s.push(`Its 52-week high is ₹${formatNumber(t['52WeekHigh'])} and its 52-week low is ₹${formatNumber(t['52WeekLow'])}.`);
      if (h.RevenueTTM) s.push(`Trailing twelve-month revenue stands at ₹${formatLargeNumber(h.RevenueTTM)}${h.ProfitMargin ? ` with a net profit margin of ${formatPercent(h.ProfitMargin)}` : ''}.`);
      return escapeHTML(s.join(' '));
    }

    // FAQ entries targeting common "people also ask" queries. Only includes answers we have data for.
    function buildFaqs(data, symbol, currentPrice, asOfLabel) {
      const g = data.fundamentals?.General || {};
      const h = data.fundamentals?.Highlights || {};
      const t = data.fundamentals?.Technicals || {};
      const d = data.fundamentals?.SplitsDividends || {};
      const name = g.Name || symbol;
      const faqs = [];
      if (currentPrice) faqs.push({ q: `What is the share price of ${name} today?`, a: `${name} (${symbol}) share price is ₹${formatNumber(currentPrice)} as of ${asOfLabel} on the ${g.Exchange || 'NSE'}.` });
      if (h.MarketCapitalization) faqs.push({ q: `What is the market cap of ${name}?`, a: `The market capitalisation of ${name} is ₹${formatLargeNumber(h.MarketCapitalization)}.` });
      if (h.PERatio) faqs.push({ q: `What is the P/E ratio of ${name}?`, a: `${name} has a trailing P/E ratio of ${formatNumber(h.PERatio)}${h.EarningsShare ? ` with earnings per share (EPS) of ₹${formatNumber(h.EarningsShare)}` : ''}.` });
      if (t['52WeekHigh'] && t['52WeekLow']) faqs.push({ q: `What is the 52-week high and low of ${name} share?`, a: `The 52-week high of ${name} is ₹${formatNumber(t['52WeekHigh'])} and the 52-week low is ₹${formatNumber(t['52WeekLow'])}.` });
      if (d.ForwardAnnualDividendRate) faqs.push({ q: `Does ${name} pay dividends?`, a: `Yes. ${name} has an annual dividend of ₹${formatNumber(d.ForwardAnnualDividendRate)} per share, a dividend yield of ${formatPercent(d.ForwardAnnualDividendYield || 0)}.` });
      if (g.Sector) faqs.push({ q: `Which sector does ${name} belong to?`, a: `${name} belongs to the ${g.Sector} sector${g.Industry ? `, in the ${g.Industry} industry` : ''}.` });
      faqs.push({ q: `How can I buy ${name} shares?`, a: `You can buy ${name} (${symbol}) shares on the NSE through a SEBI-registered stockbroker using a demat and trading account. You can also explore expert-curated stock baskets on the Labh app.` });
      return faqs;
    }

    function escapeHTML(str) {
      return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // Initialize price chart
    let priceChart = null;
    let allPriceData = [];

    function initPriceChart(priceHistory, isPositive) {
      allPriceData = priceHistory;

      const ctx = document.getElementById('priceChart');
      if (!ctx || !window.Chart) return;

      // Filter data for 1 month by default
      const filteredData = filterPriceData(priceHistory, '1M');

      const gradient = ctx.getContext('2d').createLinearGradient(0, 0, 0, 400);
      gradient.addColorStop(0, isPositive ? 'rgba(34, 197, 94, 0.3)' : 'rgba(239, 68, 68, 0.3)');
      gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

      priceChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: filteredData.map(d => d.date),
          datasets: [{
            label: 'Price',
            data: filteredData.map(d => d.price),
            borderColor: isPositive ? '#22c55e' : '#ef4444',
            backgroundColor: gradient,
            borderWidth: 2,
            fill: true,
            tension: 0.4,
            pointRadius: 0,
            pointHoverRadius: 5,
            pointHoverBackgroundColor: isPositive ? '#22c55e' : '#ef4444',
            pointHoverBorderColor: '#fff',
            pointHoverBorderWidth: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            intersect: false,
            mode: 'index'
          },
          plugins: {
            legend: {
              display: false
            },
            tooltip: {
              backgroundColor: 'rgba(22, 22, 42, 0.95)',
              titleColor: '#fff',
              bodyColor: '#ccc',
              borderColor: 'rgba(124, 58, 237, 0.5)',
              borderWidth: 1,
              padding: 12,
              displayColors: false,
              callbacks: {
                title: (items) => {
                  return new Date(items[0].label).toLocaleDateString('en-IN', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                  });
                },
                label: (item) => {
                  return '₹' + formatNumber(item.parsed.y);
                }
              }
            }
          },
          scales: {
            x: {
              grid: {
                display: false,
                drawBorder: false
              },
              ticks: {
                color: '#999',
                maxTicksLimit: 8,
                callback: function(value, index, ticks) {
                  const date = new Date(this.getLabelForValue(value));
                  return date.toLocaleDateString('en-IN', { month: 'short', day: 'numeric' });
                }
              }
            },
            y: {
              grid: {
                color: 'rgba(124, 58, 237, 0.1)',
                drawBorder: false
              },
              ticks: {
                color: '#999',
                callback: function(value) {
                  return '₹' + formatNumber(value);
                }
              }
            }
          }
        }
      });

      // Add event listeners to chart control buttons
      const chartBtns = document.querySelectorAll('.chart-control-btn');
      chartBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          chartBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          updateChart(btn.dataset.period);
        });
      });
    }

    // Filter price data based on period
    function filterPriceData(data, period) {
      if (period === 'ALL') return data;

      const now = new Date();
      const periodMap = {
        '1M': 30,
        '3M': 90,
        '6M': 180,
        '1Y': 365,
        '5Y': 1825
      };

      const days = periodMap[period] || 1;
      const cutoffDate = new Date(now.getTime() - days * 24 * 60 * 60 * 1000);

      return data.filter(d => new Date(d.date) >= cutoffDate);
    }

    // Update chart with new period
    function updateChart(period) {
      if (!priceChart) return;

      const filteredData = filterPriceData(allPriceData, period);

      // Check if we have enough data points for this period
      if (filteredData.length < 2) {
        console.warn(`Not enough data points for ${period} period. Showing all available data instead.`);
        // Fall back to showing all data if filtered data is insufficient
        const fallbackData = allPriceData.length >= 2 ? allPriceData : filteredData;
        priceChart.data.labels = fallbackData.map(d => d.date);
        priceChart.data.datasets[0].data = fallbackData.map(d => d.price);
      } else {
        priceChart.data.labels = filteredData.map(d => d.date);
        priceChart.data.datasets[0].data = filteredData.map(d => d.price);
      }

      priceChart.update();
    }

    // Show loading state
    function showLoading() {
      document.getElementById('headerContent').innerHTML = `
        <div class="loading-container" role="status" aria-live="polite" aria-label="Loading stock data">
          <div class="loading-spinner" aria-hidden="true"></div>
          <div class="loading-text">Loading stock data...</div>
        </div>
      `;
      document.getElementById('mainContent').innerHTML = '';
    }

    // Show error state
    function showError(title, message) {
      // Error / empty pages must not be indexed (avoids soft-404s in Search Console)
      document.getElementById('metaRobots')?.setAttribute('content', 'noindex, follow');
      document.getElementById('headerContent').innerHTML = `
        <div class="error-container" role="alert" aria-live="assertive">
          <svg class="error-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12,2L1,21H23M12,6L19.53,19H4.47M11,10V14H13V10M11,16V18H13V16"/>
          </svg>
          <h1 class="error-title">${title}</h1>
          <p class="error-message">${message}</p>
          <a href="/search.html" class="btn-primary" aria-label="Return to stock search page">Back to Search</a>
        </div>
      `;
      document.getElementById('mainContent').innerHTML = '';
    }

    // Utility functions
    function formatNumber(num) {
      if (!num || isNaN(num)) return 'N/A';
      return Number(num).toLocaleString('en-IN', { maximumFractionDigits: 2 });
    }

    function formatLargeNumber(num) {
      if (!num || isNaN(num)) return 'N/A';

      const absNum = Math.abs(num);

      if (absNum >= 1e12) {
        return (num / 1e12).toFixed(2) + 'T';
      } else if (absNum >= 1e9) {
        return (num / 1e9).toFixed(2) + 'B';
      } else if (absNum >= 1e7) {
        return (num / 1e7).toFixed(2) + 'Cr';
      } else if (absNum >= 1e5) {
        return (num / 1e5).toFixed(2) + 'L';
      } else if (absNum >= 1e3) {
        return (num / 1e3).toFixed(2) + 'K';
      }

      return formatNumber(num);
    }

    function formatPercent(num) {
      if (!num || isNaN(num)) return 'N/A';
      return (num * 100).toFixed(2) + '%';
    }

    function fmtCr(val) {
      if (val === null || val === undefined || val === '' || isNaN(Number(val))) return '—';
      const n = Number(val) / 1e7; // raw value is in base currency units; divide by 1Cr
      return n.toFixed(2);
    }

    function fmtPct(num, den) {
      if (!num || !den || isNaN(num) || isNaN(den) || Number(den) === 0) return '—';
      return (Math.abs(Number(num) / Number(den)) * 100).toFixed(1) + '%';
    }

    function fmtEps(val) {
      if (val === null || val === undefined || val === '' || isNaN(Number(val))) return '—';
      return Number(val).toFixed(2);
    }

    function buildIncomeTable(quarterly, earningsHistory) {
      if (!quarterly) return '<p style="color:#999">No data available</p>';
      const dates = Object.keys(quarterly).slice(0, 8).reverse();
      if (!dates.length) return '<p style="color:#999">No data available</p>';

      // Build EPS lookup by date
      const epsMap = {};
      if (earningsHistory) {
        Object.values(earningsHistory).forEach(e => {
          if (e.date && e.epsActual !== undefined) epsMap[e.date] = e.epsActual;
        });
      }

      const rows = [
        { label: 'Sales (₹Cr)',          key: 'totalRevenue',              fmt: fmtCr, highlight: false },
        { label: 'Expenses (₹Cr)',        key: 'totalOperatingExpenses',    fmt: fmtCr, highlight: false },
        { label: 'Operating Profit (₹Cr)',key: 'operatingIncome',           fmt: fmtCr, highlight: true  },
        { label: 'Other Income (₹Cr)',    key: 'nonOperatingIncomeNetOther',fmt: fmtCr, highlight: false },
        { label: 'Interest (₹Cr)',        key: 'interestExpense',           fmt: (v) => v ? Math.abs(fmtCr(v)) : '—', highlight: false },
        { label: 'Depreciation (₹Cr)',    key: 'depreciationAndAmortization',fmt: fmtCr, highlight: false },
        { label: 'PBT (₹Cr)',             key: 'incomeBeforeTax',           fmt: fmtCr, highlight: false },
        { label: 'Tax %',                 key: '__tax_pct__',               fmt: null,  highlight: false },
        { label: 'Net Profit (₹Cr)',      key: 'netIncome',                 fmt: fmtCr, highlight: true  },
        { label: 'EPS (₹)',               key: '__eps__',                   fmt: null,  highlight: false },
      ];

      let html = '<table class="fin-table"><thead><tr><th>Metric</th>';
      dates.forEach(d => { html += `<th>${formatQuarterLabel(d)}</th>`; });
      html += '</tr></thead><tbody>';

      rows.forEach(row => {
        const cls = row.highlight ? ' class="highlight-row"' : '';
        html += `<tr${cls}><td>${row.label}</td>`;
        dates.forEach(d => {
          const q = quarterly[d] || {};
          let cell;
          if (row.key === '__tax_pct__') {
            cell = fmtPct(q.incomeTaxExpense, q.incomeBeforeTax);
          } else if (row.key === '__eps__') {
            cell = fmtEps(epsMap[d]);
          } else {
            cell = row.fmt(q[row.key]);
          }
          const numVal = parseFloat(cell);
          let colorCls = '';
          if (!isNaN(numVal) && row.key !== '__tax_pct__' && row.key !== '__eps__' && row.highlight) {
            colorCls = numVal >= 0 ? ' class="positive"' : ' class="negative"';
          }
          html += `<td${colorCls}>${cell}</td>`;
        });
        html += '</tr>';
      });

      html += '</tbody></table>';
      return html;
    }

    function buildBalanceSheetTable(quarterly) {
      if (!quarterly) return '<p style="color:#999">No data available</p>';
      const dates = Object.keys(quarterly).slice(0, 8).reverse();
      if (!dates.length) return '<p style="color:#999">No data available</p>';

      const rows = [
        { label: 'Equity Capital (₹Cr)',   key: 'capitalStock',              highlight: false },
        { label: 'Reserves (₹Cr)',         key: 'retainedEarnings',          highlight: false },
        { label: 'Borrowings (₹Cr)',       key: 'shortLongTermDebtTotal',     highlight: false },
        { label: 'Other Liabilities (₹Cr)',key: 'otherCurrentLiab',          highlight: false },
        { label: 'Total Liabilities (₹Cr)',key: 'totalLiab',                 highlight: true  },
        { label: 'Fixed Assets (₹Cr)',     key: 'propertyPlantAndEquipmentNet',highlight: false },
        { label: 'Investments (₹Cr)',      key: 'longTermInvestments',        highlight: false },
        { label: 'Cash & Equiv. (₹Cr)',    key: 'cashAndEquivalents',         highlight: false },
        { label: 'Receivables (₹Cr)',      key: 'netReceivables',             highlight: false },
        { label: 'Other Assets (₹Cr)',     key: 'otherAssets',                highlight: false },
        { label: 'Total Assets (₹Cr)',     key: 'totalAssets',                highlight: true  },
      ];

      let html = '<table class="fin-table"><thead><tr><th>Metric</th>';
      dates.forEach(d => { html += `<th>${formatQuarterLabel(d)}</th>`; });
      html += '</tr></thead><tbody>';

      rows.forEach(row => {
        const cls = row.highlight ? ' class="highlight-row"' : '';
        html += `<tr${cls}><td>${row.label}</td>`;
        dates.forEach(d => {
          const q = quarterly[d] || {};
          const cell = fmtCr(q[row.key]);
          html += `<td>${cell}</td>`;
        });
        html += '</tr>';
      });

      html += '</tbody></table>';
      return html;
    }

    function buildCashFlowTable(quarterly) {
      if (!quarterly) return '<p style="color:#999">No data available</p>';
      const dates = Object.keys(quarterly).slice(0, 8).reverse();
      if (!dates.length) return '<p style="color:#999">No data available</p>';

      const rows = [
        { label: 'Operating CF (₹Cr)',    key: 'totalCashFromOperatingActivities',    highlight: true  },
        { label: 'Investing CF (₹Cr)',    key: 'totalCashflowsFromInvestingActivities',highlight: false },
        { label: 'Financing CF (₹Cr)',    key: 'totalCashFromFinancingActivities',    highlight: false },
        { label: 'Capex (₹Cr)',           key: 'capitalExpenditures',                highlight: false },
        { label: 'Free Cash Flow (₹Cr)',  key: 'freeCashFlow',                       highlight: true  },
        { label: 'Net Change in Cash (₹Cr)', key: 'changeInCash',                   highlight: false },
      ];

      let html = '<table class="fin-table"><thead><tr><th>Metric</th>';
      dates.forEach(d => { html += `<th>${formatQuarterLabel(d)}</th>`; });
      html += '</tr></thead><tbody>';

      rows.forEach(row => {
        const cls = row.highlight ? ' class="highlight-row"' : '';
        html += `<tr${cls}><td>${row.label}</td>`;
        dates.forEach(d => {
          const q = quarterly[d] || {};
          const cell = fmtCr(q[row.key]);
          const numVal = parseFloat(cell);
          let colorCls = '';
          if (!isNaN(numVal) && row.highlight) {
            colorCls = numVal >= 0 ? ' class="positive"' : ' class="negative"';
          }
          html += `<td${colorCls}>${cell}</td>`;
        });
        html += '</tr>';
      });

      html += '</tbody></table>';
      return html;
    }

    function formatQuarterLabel(dateStr) {
      const d = new Date(dateStr);
      const month = d.toLocaleString('en-IN', { month: 'short' });
      const year = String(d.getFullYear()).slice(-2);
      return `${month} '${year}`;
    }
